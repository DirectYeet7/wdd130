<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            width: 40%;
            height: auto;
            margin: 10px auto 30px;
            border: 20px solid darkblue;
            border-radius: 40px;
            overflow: hidden;
            background-color: white;
        }

        .heading {
            position: relative;
            width: 100%;
            height: auto;
        }

        .heading img {
            display: block;
            width: 100%;
            height: 275px;
            object-fit: cover;
            box-sizing: border-box;
            object-position: center top;
        }

        .heading button {
            position: absolute;
            left: 5%;
            top: 6%;
            transform: scale(1.5);
        }

        .text {
            top: 45%;
            left: 29%;
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            text-shadow: 3px 2px 2px black;
        }

        .text h1 {
            font-size: 50px;
        }

        .text h2 {
            font-size: 40px;
        }

        h3 {
            text-align: center;
            font-weight: 600;
            font-size: 25px;
            margin: 20px 0;
        }

        #myForm {
            display: grid;
            justify-items: center;
            gap: 40px;
            grid-template-columns: 1fr 1fr;
            justify-items: left;
            padding: 20px;
        }

        input[type=text] {
            width: 95%;
        }

        input[type=password] {
            width: 95%;
        }

        input[type=email] {
            width: 95%;
        }

        .newsletter {
            grid-column: span 2;
            justify-self: center;
        }

        .terms {
            grid-column: span 2;
            justify-self: center;
        }

        .submit {
            grid-column: span 2;
            justify-self: center;
        }

        .books {
            width: 100%;
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
        }

        .books img {
            width: 20%;
        }

    </style>




</head>

<body>
    <div id="formContainer">
        <section class="heading">
            <button type="button" id="closeBtn">X</button>
            <img src="images/jesus_feeds_5000.jpeg" alt="Jesus Feeds 5000">
            <div class="text">
                <h1>Daily Feed</h1>
                <h2>Scripture a Day</h2>
            </div>
        </section>

        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">
            
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section class="newsletter">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section class="terms">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section class="submit">
                <button type="submit">Submit</button>
            </section>
        </form>
        <section class="books">
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine & Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </section>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
